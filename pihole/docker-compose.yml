services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8082:80/tcp"          # admin UI; 80/443 stay free for Traefik
    environment:
      TZ: Europe/Vienna
      FTLCONF_webserver_api_password: "CHANGE_ME"
      FTLCONF_dns_upstreams: "1.1.1.1;9.9.9.9"
      FTLCONF_dns_listeningMode: "all"        # required with bridge networking
      # wildcard: home.lan and every *.home.lan -> the Pi
      FTLCONF_misc_dnsmasq_lines: "address=/home.lan/10.0.0.185"
    volumes:
      - pihole_etc:/etc/pihole
volumes:
  pihole_etc:
